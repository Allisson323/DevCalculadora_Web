<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styless.css">
</head>
<body>
    <header>
    <img class="LogoSite" src="imgDevWeb/logoDevWeb1.png" alt="Logo do site">
    <div class="TituloCalc">
        <h2>HTML/CSS + JAVASCRIPTS</h2>
        <p>Criando uma calculadora de forma simples: Utilizando HTML/CSS + JAVASCRIPTS</p>
    </div>
</header>

    <section class="calculadora">
        <input type="text" class="display" value="0" >
        <div class="buttons">
            <button class="limpar">C</button>
            <button>(</button>
            <button>)</button>
            <button class="operacao">/</button>
            
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operacao">*</button>
            
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operacao">-</button>
            
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operacao">+</button>
            
            <button>0</button>
            <button>.</button>
            <button class="igual">=</button>
        </div>
    </section>
    
    <script src="main.js"></script>

</body>
</html>
